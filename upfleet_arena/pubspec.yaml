name: upfleet_arena
description: "UpFleet Arena - LAN-only turn-based naval combat game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (plan §6.1)
  flutter_riverpod: ^3.0.0

  # Navigation (plan §6.1)
  go_router: ^16.0.0

  # LAN service discovery candidates - evaluated in Phase 0 (plan §6.1, §15 Phase 0)
  bonsoir: ^7.1.0
  nsd: ^5.0.0

  # Runtime permission handling (plan §6.1, §11)
  permission_handler: ^13.0.0

  # Non-sensitive local preferences (plan §6.1, §7.2)
  shared_preferences: ^2.5.0

  # Hashing of resume tokens (plan §12). The raw token is never stored.
  crypto: ^3.0.0
  # Native share sheet for the room invitation (plan §5.2 Lobby).
  share_plus: ^13.3.1
  # Keep the Host screen awake while hosting (plan §2.9, §15 Phase 8).
  wakelock_plus: ^1.8.2
  # Shot and result sound effects (plan §15 Phase 8).
  audioplayers: ^6.8.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
